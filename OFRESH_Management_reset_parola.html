 async function initPasswordRecovery(){
   const hash=location.hash.replace(/^#/,"");
   if(!hash)return;
   const params=new URLSearchParams(hash);
   const error=params.get("error_description")||params.get("error");
   const type=params.get("type");
   const access=params.get("access_token");
   const refresh=params.get("refresh_token");
   if(error){
     const msgText=decodeURIComponent(error.replace(/\+/g," "));
     document.getElementById("app").innerHTML='<div class="panel"><div class="empty"><strong>Linkul de resetare nu mai este valabil.</strong><br><br>'+esc(msgText)+"</div></div>";
     return;
   }
   if(type==="recovery" || (access&&refresh)){
     if(!supabaseClient){document.getElementById("app").innerHTML='<div class="panel"><div class="empty">Nu pot porni modul de resetare Supabase.</div></div>';return;}
     try{
       const r=await supabaseClient.auth.setSession({access_token:access||"",refresh_token:refresh||""});
       if(r.error)throw r.error;
       document.getElementById("app").innerHTML=`<section class="panel" style="max-width:520px;margin:50px auto">
         <div class="eyebrow">OFRESH MANAGEMENT</div><h2>Seteaza parola noua</h2>
         <p class="small">Introdu parola noua pentru contul tau OFRESH.</p>

         </div>
         <div id="passwordError" class="hint dangerText" style="margin-top:10px"></div>
         <div class="quickActions" style="margin-top:18px"><button class="primaryButton" onclick="finishPasswordRecovery()">Schimba parola</button></div>
       </section>`;
     }catch(e){
       document.getElementById("app").innerHTML='<div class="panel"><div class="empty"><strong>Nu pot valida linkul de resetare.</strong><br><br>'+esc(e.message||e)+"</div></div>";
     }
   }
 }
 async function finishPasswordRecovery(){
   const p=document.getElementById("newPassword")?.value||"";
   const c=document.getElementById("confirmPassword")?.value||"";
   const er=document.getElementById("passwordError");
   if(er)er.textContent="";
   if(p.length<6){if(er)er.textContent="Parola trebuie sa aiba cel putin 6 caractere.";return;}

     history.replaceState(null,"",location.pathname+location.search);
   }catch(e){if(er)er.textContent=e.message||String(e);}
 }

const TECH_KEY="ofresh_tehnicieni";
let techSession=null;
function getTechnicians(){
  const remote=Array.isArray(db.Tehnicieni)?db.Tehnicieni:[];
  let local=[];
  try{local=JSON.parse(localStorage.getItem(TECH_KEY)||"[]");if(!Array.isArray(local))local=[]}catch(e){}
  const all=[...remote,...local];
  const map=new Map();
  all.forEach(x=>{const id=technicianId(x)||String(technicianPhone(x));if(id)map.set(id,x)});
  return [...map.values()];
}

async function saveTechnician(old={}){
  const name=v("tnume");
  if(!name)return msg("Completeaza numele tehnicianului.",false);
  const rec={"ID Tehnician":technicianId(old)||uid("TECH"),"Nume":name,"Telefon":v("ttelefon"),"PIN":v("tpin"),"Email":v("temail"),"Status":v("tstatus")||"Activ","Observatii":v("tobs"),"Data creare":old["Data creare"]||new Date().toISOString().slice(0,10)};
  try{
    // Tehnicienii existenti doar local nu exista inca in Google Sheet. In acest caz facem ADD, nu UPDATE.
    const remote=Array.isArray(db.Tehnicieni)?db.Tehnicieni:[];
    const existsRemote=remote.some(x=>String(technicianId(x)).trim()===String(rec["ID Tehnician"]).trim());
    await saveTechnicianCentral(rec,existsRemote?rec["ID Tehnician"]:"");
    const arr=getTechnicians().filter(x=>technicianId(x)!==rec["ID Tehnician"]); arr.unshift(rec); saveTechnicians(arr);
    closeModal();msg("Tehnician salvat in Google Sheet."); await load();
    if(technicianReturnToIntervention){ technicianReturnToIntervention=false; openIntervention(); }
  }catch(e){
    const arr=getTechnicians().filter(x=>technicianId(x)!==rec["ID Tehnician"]); arr.unshift(rec); saveTechnicians(arr);
    closeModal();msg("Eroare la sincronizarea cu Google Sheet: "+(e.message||e),false);
    if(technicianReturnToIntervention){ technicianReturnToIntervention=false; openIntervention(); } else techniciansPage();
  }
}

  saveTechnicians(getTechnicians().filter(x=>technicianId(x)!==id));

}
