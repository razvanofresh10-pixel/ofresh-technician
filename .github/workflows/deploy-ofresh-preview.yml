name: Deploy OFRESH Supabase Preview
# Preview-only deployment; publish from supabase-preview without touching production.
# Trigger preview deployment after the full technician/filer app integration.

on:
  push:
    branches:
      - supabase-preview
    paths:
      - "index.html"
      - "admin-mobile-access.html"
      - "mobile/**"
      - "ofresh-manifest.json"
      - "ofresh-sw.js"
      - "icons/**"
      - ".github/workflows/deploy-ofresh-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ofresh-supabase-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Republish verified optional serial support for machine form
        run: python3 scripts/fix-preview-index.py

      - name: Upload preview site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Wait for Pages artifact indexing
        run: sleep 15

      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
