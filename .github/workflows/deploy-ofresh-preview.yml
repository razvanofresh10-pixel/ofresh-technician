name: Deploy OFRESH Supabase Preview
# Preview-only deployment; publish from supabase-preview without touching production.
# Preview deployment after the full technician/filer app integration.

on:
  push:
    branches:
      - supabase-preview
    paths:
      - "index.html"
      - "admin-mobile-access.html"
      - "mobile/**"
      - "ofresh-manifest.json"
      - "ofresh-sw.js"
      - "icons/**"
      - "scripts/fix-preview-index.py"
      - ".github/workflows/deploy-ofresh-preview.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ofresh-supabase-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Optimize technician photo compression to 75 KB
        run: python3 scripts/fix-preview-index.py

      # Reruns can leave a Pages artifact from the previous attempt attached
      # to the same workflow run. Remove it before uploading the next artifact.
      - name: Remove previous Pages artifacts from this workflow run
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: context.runId,
              per_page: 100
            });
            for (const artifact of data.artifacts.filter(item => item.name === "github-pages")) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id
              });
              core.info(`Deleted previous Pages artifact ${artifact.id}`);
            }

      - name: Upload preview site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Wait for Pages artifact indexing
        run: sleep 15

      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
