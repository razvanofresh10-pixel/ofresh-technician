function buildClientsFromMachines(machines){
  const rows=Array.isArray(machines)?machines:[];
  const map=new Map();
  for(const m of rows){
    const name=String(m.Client||m.client||m["Nume client"]||m["Nume locatie"]||m.Locatie||m.locatie||"").trim();
    if(!name) continue;
    const address=String(m.Adresa||m.adresa||"").trim();
    const zone=String(m.Zona||m.zona||"").trim();
    const city=String(m.Oras||m.oras||"").trim();
    const county=String(m.Judet||m.judet||"").trim();
    const key=[name.toLowerCase(),city.toLowerCase(),county.toLowerCase(),city||county?"":address.toLowerCase()].join("|");
    if(!map.has(key)){
      const virtualId="AUTO-"+btoa(unescape(encodeURIComponent(key))).replace(/[^A-Za-z0-9]/g,"").slice(0,28);
      map.set(key,{"ID Client":virtualId,"ID Locatie":"",Client:name,"Nume locatie":name,Adresa:address,Zona:zone,Oras:city,Judet:county,Status:"Activ",_virtualFromMachines:true});
    }else{

      if(!c.Adresa&&address)c.Adresa=address;
      if(!c.Zona&&zone)c.Zona=zone;
    }
  }
  return [...map.values()];
}

    const clientMap=new Map();

      const city=String(c.Oras||c.oras||"").trim().toLowerCase();
      const county=String(c.Judet||c.judet||"").trim().toLowerCase();
      const address=String(c.Adresa||c.adresa||"").trim().toLowerCase();
      const key=name.toLowerCase()+"|"+city+"|"+county+(city||county?"":"|"+address);
      if(!clientMap.has(key)) clientMap.set(key,c);
      else {
        const x=clientMap.get(key);
        for(const k of ["Adresa","Zona","Oras","Judet","Telefon","Email","Latitudine","Longitudine"]){ if(!x[k] && c[k]) x[k]=c[k]; }
      }
    }
    db.Clienti=[...clientMap.values()];
    saveCachedData();
    // Nu inlocuim ecranul tehnicianului daca acesta este deja in cautarea clientilor.
    // load() poate termina la cateva secunde dupa login si nu trebuie sa-l scoata din cautare.
    if(techSession && !adminSession){

        const q=String(document.getElementById("techClientSearch")?.value||"").trim().toLowerCase();
        const rows=(db.Clienti||[]).filter(l=>{

          return hay.includes(q);
        });
        renderTechClientCards(rows);
      }else{
        techView="home";
        showTechnicianHome();
      }
    }else{
      render();
    }
  }catch(e){
    if(!background){
      document.getElementById("app").innerHTML='<div class="panel"><div class="empty">Nu pot incarca datele din Google Sheet.<br><br>'+esc(e.message)+'<br><br><button class="primaryButton" onclick="load()">Reincearca</button></div></div>';

  }
}

function openNavigation(url){ try{ window.location.href=url; }catch(e){ window.open(url,'_self'); } return false; }
function openWazeNavigation(address,lat,lon){
  const a=String(address||'').trim();
  const la=String(lat||'').trim();
  const lo=String(lon||'').trim();
  if(!a && !(la&&lo)){ msg("Clientul nu are adresa sau coordonate GPS.",false); return false; }
  const hasGps=la && lo && !isNaN(Number(la)) && !isNaN(Number(lo));
  const params=hasGps
    ? 'll='+encodeURIComponent(la+','+lo)+'&navigate=yes&utm_source=ofresh_online'
    : 'q='+encodeURIComponent(a)+'&navigate=yes&utm_source=ofresh_online';
  const url='https://www.waze.com/ul?'+params;
  // Deschidem direct URL-ul, sincron cu click-ul. Nu lasam un tab gol sa astepte GPS.
  const w=window.open(url,'_blank','noopener,noreferrer');
  if(!w) window.location.href=url;
  return false;
}

function openMapsNavigation(address,lat,lon){
  const a=String(address||'').trim();
  const la=String(lat||'').trim();
  const lo=String(lon||'').trim();
  const hasDestinationGps=la && lo && !isNaN(Number(la)) && !isNaN(Number(lo));
  if(!a && !hasDestinationGps){ msg("Clientul nu are adresa sau coordonate GPS.",false); return false; }

  // NU asteptam geolocatia browserului. Google Maps stie sa foloseasca automat
  // locatia curenta a telefonului ca "Locatia ta". Astfel nu mai apare niciodata
  // un tab about:blank care ramane gol.
  const destination=hasDestinationGps ? la+','+lo : a;
  const url='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(destination)+'&travelmode=driving';
  const w=window.open(url,'_blank','noopener,noreferrer');
  if(!w) window.location.href=url;
  return false;
}

async function saveClientGPS(id){
  if(!navigator.geolocation)return msg("Browserul nu suporta localizarea GPS. Deschide OFRESH in Chrome/Safari, nu intr-un preview blocat.",false);
  const c=(db.Clienti||[]).find(x=>String(clientId(x))===String(id));
  if(!c)return msg("Clientul nu a fost gasit.",false);
  msg("Obtin pozitia ta GPS... accepta permisiunea de localizare daca apare.",true);
  const savePosition=async(pos)=>{
    try{
      const lat=Number(pos.coords.latitude), lon=Number(pos.coords.longitude), accuracy=Number(pos.coords.accuracy||0);
      if(!isFinite(lat)||!isFinite(lon))throw new Error("GPS invalid.");
      const real=(db.Locatii||[]).find(x=>String(clientId(x))===String(id));
      const locationId=real?clientId(real):(id||uid("LOC"));
      const rec={...(real||{}),"ID Locatie":locationId,Client:clientName(c),"Nume locatie":clientName(c),Adresa:c.Adresa||"",Zona:c.Zona||"",Oras:c.Oras||"",Judet:c.Judet||"",Latitudine:lat,Longitudine:lon,"GPS actualizat":new Date().toISOString(),"GPS precizie":accuracy,Status:real?.Status||"Activ"};
      await rawSave("Locatii",rec,"ID Locatie",real?String(locationId):"");
      for(const x of (db.Clienti||[]))if(String(clientId(x))===String(id)){x.Latitudine=lat;x.Longitudine=lon;x["GPS actualizat"]=rec["GPS actualizat"];x["GPS precizie"]=accuracy;}
      const localLoc=(db.Locatii||[]).find(x=>String(clientId(x))===String(locationId));
      if(localLoc){localLoc.Latitudine=lat;localLoc.Longitudine=lon;localLoc["GPS actualizat"]=rec["GPS actualizat"];localLoc["GPS precizie"]=accuracy;}
      saveCachedData();
      msg("GPS salvat: "+lat.toFixed(6)+", "+lon.toFixed(6)+" | precizie ~"+Math.round(accuracy)+" m.",true);
      const input=document.getElementById("techClientSearch"),q=String(input?.value||"").trim().toLowerCase();
      const rows=(db.Clienti||[]).filter(l=>!q||[clientName(l),l.Adresa||"",l.Oras||"",l.Judet||"",l.Zona||""].join(" ").toLowerCase().includes(q));
      renderTechClientCards(rows);
    }catch(e){msg(e.message||"Nu am putut salva pozitia GPS.",false)}
  };
  const retry=(err)=>{
    if(err && err.code===1){
      msg("Localizarea este blocata pentru acest site. In Chrome: lacatul din bara de adresa → Permisiuni → Localizare → Permite, apoi apasa din nou.",false);return;
    }
    if(err && err.code===3){
      msg("GPS-ul nu a raspuns la timp. Incerc din nou cu localizare normala...",true);
      navigator.geolocation.getCurrentPosition(savePosition,()=>msg("Nu pot obtine pozitia. Activeaza Localizarea telefonului si permisiunea pentru Chrome si incearca din nou.",false),{enableHighAccuracy:false,timeout:30000,maximumAge:10000});
      return;
    }
    msg("Nu pot obtine pozitia curenta. Verifica Localizarea telefonului si permisiunea pentru Chrome/Safari.",false);
  };
  navigator.geolocation.getCurrentPosition(savePosition,retry,{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}

  if(commercialSession){commercialTab='aparate';commercialPage();document.getElementById("pageTitle").textContent="Comercial";document.getElementById("crumb").textContent="Comercial";return;}

    ${inputField("Telefon","commercialTelefon","","tel")}
    ${inputField("PIN","commercialPin","","password")}

        ev.stopPropagation();

    tel?.focus();
  },50);

async function loginCommercial(){
  const telefon=v("commercialTelefon").replace(/\s+/g,"").replace(/-/g,"");
  const pin=v("commercialPin").trim();
  if(!telefon||!pin)return msg("Completeaza telefonul si PIN-ul.",false);
  try{
    const r=await api({action:"commercialData",telefon:telefon,pin:pin});
    if(!r||!r.success)throw new Error(r?.error||"Telefonul sau PIN-ul este gresit.");
    commercialSession=r.user||{Telefon:telefon,Rol:"comercial"};
    commercialDb={Aparate:Array.isArray(r.data?.Aparate)?r.data.Aparate:[],Filtre:Array.isArray(r.data?.Filtre)?r.data.Filtre:[],Interventii:Array.isArray(r.data?.Interventii)?r.data.Interventii:[]};
    closeModal();commercialTab='aparate';commercialCounty='';searchTerm='';commercialPage();
    document.getElementById("pageTitle").textContent="Comercial";document.getElementById("crumb").textContent="Comercial";
  }catch(e){msg(e.message||"Nu am putut valida accesul Comercial.",false)}
}

function interventionsPage(){const rows=(db.Interventii||[]).filter(matches);document.getElementById("app").innerHTML=pageHero("SERVICE","Interventii","Istoricul lucrarilor si interventiilor tehnice",`<button class="primaryButton" onclick="openIntervention()">+ Inregistreaza interventie</button>`)+`<section class="panel"><div class="panelHeader"><div><h3>Istoric interventii</h3><p>${rows.length} interventii</p></div><button class="secondaryButton" onclick="exportInvoice()">Export De facturat</button></div>${rows.length?`<div class="tableWrap"><table class="table"><thead><tr><th>Data</th><th>Aparat</th><th>Client</th><th>Tehnician</th><th>Tip interventie</th><th>Operatiuni</th><th>Filtru</th><th>Urmatoarea interventie</th><th>Facturare</th></tr></thead><tbody>${rows.map(i=>{const bill=i.deFacturat===true||i.solicitareClient===true||String(i["De facturat"]||"").toUpperCase()==="DA";const sf=i.tipFiltru||i["Tip filtru"]||"";const next=i.urmatorSchimbFiltru||i["Urmator schimb"]||"";return `<tr><td>${esc(i.data||i.Data||"")}</td><td><strong>${esc(i.aparat||i.Aparat||i["ID Aparat"]||"")}</strong></td><td>${esc(i.Client||i.client||i.locatie||i.Locatie||"")}</td><td>${esc(i.tehnician||i.Tehnician||"")}</td><td>${esc(i.tipInterventie||i["Tip interventie"]||"")}</td><td>${esc(Array.isArray(i.operatiuni)?i.operatiuni.join(", "):i.operatiuni||i["Operatiuni efectuate"]||"")}</td><td>${esc(sf)}${next?`<div class="small">Urmator: ${esc(next)}</div>`:""}</td><td>${esc(i.urmatoareaInterventie||i["Urmatoarea interventie"]||"")}</td><td><span class="billingBadge ${bill?"":"billingNo"}">${bill?"DE FACTURAT":"NU SE FACTUREAZA"}</span></td></tr>`}).join("")}</tbody></table></div>`:'<div class="emptyState">Nu exista interventii.</div>'}</section>`}
function filtersPage(){const rows=(db.Filtre||[]).filter(matches);document.getElementById("app").innerHTML=pageHero("MENTENANTA","Filtre","Urmarirea schimburilor si a termenelor pentru filtre",`<button class="primaryButton" onclick="openFilter()">+ Adauga filtru</button>`)+`<section class="panel"><div class="panelHeader"><div><h3>Monitorizare filtre</h3><p>${rows.length} filtre inregistrate</p></div></div>${rows.length?`<div class="tableWrap"><table class="table"><thead><tr><th>Aparat</th><th>Client</th><th>Zona</th><th>Tip filtru</th><th>Montat la</th><th>Scadenta</th><th>Status</th></tr></thead><tbody>${rows.map(f=>{const d=f["Data urmatoarei schimbari"]||f.scadenta||f.urmatorSchimb||"";const s=soonDate(d);const m=(db.Aparate||[]).find(x=>String(machineId(x))===String(f["ID Aparat"]||f.aparatId||""));const c=(db.Clienti||[]).find(x=>String(clientId(x))===String(f["ID Locatie"]||f["ID Client"]||""));return `<tr><td>${esc(machineLabel(m||{})||f.Aparat||f.aparat||f["ID Aparat"]||f.aparatId||"")}</td><td>${esc(c?clientName(c):(f.Client||f.client||f.Locatie||f.locatie||""))}</td><td>${esc(machineFloor(m||{})||f.Zona||f.zona||"")}</td><td>${esc(f["Tip filtru"]||f.tipFiltru||f.tip||"")}</td><td>${esc(f["Data montare"]||f.montat||f.dataSchimbare||"")}</td><td>${esc(d)}</td><td><span class="badge ${s?"warningBadge":""}">${s?"NECESITA ATENTIE":"OK"}</span></td></tr>`}).join("")}</tbody></table></div>`:'<div class="emptyState">Nu exista filtre.</div>'}</section>`}

function userRightsList(){return [
  ["Dashboard","Dashboard"],["Clienti","Clienti"],["Aparate","Aparate"],["Export Aparate","Export Aparate"],
  ["Interventii","Interventii"],["Filtre","Filtre / Istoric filtre"],["Stoc","Stoc"],["Tehnicieni","Tehnicieni"],
  ["Rapoarte","Rapoarte"],["Mod Tehnician","Mod Tehnician"],["Comercial","Modul Comercial"]
];}
function userId(x){return x?.["ID Utilizator"]||x?.id||""}
function userName(x){return x?.Nume||x?.nume||""}
function userPhone(x){return x?.Telefon||x?.telefon||""}
function userPin(x){return String(x?.PIN||x?.pin||"")}
function userRole(x){return String(x?.Rol||x?.rol||"").trim().toLowerCase()}
function userStatus(x){return x?.Status||x?.status||"Activ"}
function userRights(x){const raw=x?.Drepturi||x?.drepturi||"";return String(raw).split(/[,;|]/).map(v=>v.trim()).filter(Boolean)}
function userIsAdmin(x){return userRole(x)==="administrator"||userRole(x)==="admin"}
function roleDefaultRights(role){
  const r=String(role||"").trim().toLowerCase();
  if(r==="administrator"||r==="admin") return userRightsList().map(x=>x[0]);
  if(r==="comercial") return ["Aparate","Filtre","Interventii"];
  return [];
}
function applyRoleRights(role){
  const defaults=new Set(roleDefaultRights(role));
  document.querySelectorAll("[data-right]").forEach(cb=>{ cb.checked=defaults.has(cb.dataset.right); });
}
function openUser(r={}){
  const old=userId(r);
  const role=String(r.Rol||r.rol||"Comercial").trim().toLowerCase();
  const rights=old ? userRights(r) : roleDefaultRights(role);
  const checks=userRightsList().map(([key,label])=>`<label class="checkRow"><input type="checkbox" id="right_${esc(key).replace(/[^A-Za-z0-9]/g,'_')}" data-right="${esc(key)}" ${rights.includes(key)?'checked':''}><span>${esc(label)}</span></label>`).join("");
  const roleSelect=`<div class="field"><label>Rol</label><select id="f_urole" onchange="applyRoleRights(this.value)"><option value="administrator" ${role==="administrator"||role==="admin"?'selected':''}>administrator</option><option value="comercial" ${role==="comercial"?'selected':''}>comercial</option><option value="utilizator" ${role==="utilizator"?'selected':''}>utilizator</option></select></div>`;
  modal(old?"Modifica utilizator":"Adauga utilizator",`<div class="grid">
    ${inputField("Nume","unume",userName(r))}${inputField("Telefon","utelefon",userPhone(r),"tel")}
    ${inputField("PIN","upin",userPin(r),"password")}${inputField("Email","uemail",r.Email||r.email||"","email")}
    ${roleSelect}${selectField("Status","ustatus",userStatus(r),["Activ","Inactiv"])}
    ${inputField("Observatii","uobs",r.Observatii||r.observatii||"","text",true)}
    <div class="field wide"><span>Drepturi de acces</span><div class="checkList">${checks}</div><div class="hint"><strong>Administrator:</strong> toate drepturile sunt active. <strong>Comercial:</strong> Aparate si Filtre / Istoric filtre sunt bifate automat. Restul drepturilor pot fi acordate manual.</div></div>
  </div>`,`Salveaza utilizator`,`saveUser(${JSON.stringify(r)})`);
}
async function saveUser(old={}){
  const name=v("unume"), phone=v("utelefon"), pin=v("upin"), role=v("urole")||"comercial", status=v("ustatus")||"Activ";
  if(!name||!phone||!pin)return msg("Completeaza numele, telefonul si PIN-ul.",false);
  const rights=[...document.querySelectorAll('[data-right]:checked')].map(x=>x.dataset.right);
  const finalRights=(role==="administrator")?userRightsList().map(x=>x[0]):rights;
  const rec={"ID Utilizator":userId(old)||uid("USR"),"Nume":name,"Telefon":phone,"PIN":pin,"Email":v("uemail"),"Rol":role,"Status":status,"Observatii":v("uobs"),"Drepturi":finalRights.join(", "),"Data creare":old["Data creare"]||new Date().toISOString().slice(0,10)};
  try{const exists=(db.Utilizatori||[]).some(x=>String(userId(x))===String(rec["ID Utilizator"]));await rawSave("Utilizatori",rec,"ID Utilizator",exists?rec["ID Utilizator"]:"");closeModal();msg("Utilizator salvat.");await load();go("utilizatori");}catch(e){msg(e.message||"Nu am putut salva utilizatorul.",false)}
}

function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function inputField(label,key,val="",type="text",wide=false,extra=""){return `<label class="field ${wide?"wide":""}"><span>${esc(label)}</span><input id="f_${key}" type="${type}" value="${esc(val)}" ${extra}></label>`}
function selectField(label,key,val,opts,wide=false){return `<label class="field ${wide?"wide":""}"><span>${esc(label)}</span><select id="f_${key}"><option value="">Selecteaza</option>${opts.map(o=>`<option value="${esc(o)}" ${String(o)===String(val)?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`}
function clientInputField(val=""){const clients=(db.Clienti||[]).map(clientName).filter(Boolean);return `<label class="field"><span>Client</span><input id="f_client" list="clientList" value="${esc(val)}" autocomplete="off" placeholder="Scrie clientul, ex. MICRO"><datalist id="clientList">${clients.map(c=>`<option value="${esc(c)}"></option>`).join("")}</datalist></label>`}
function getMachineModels(){const base=["TS 400","TS 200"];try{return [...new Set(base.concat(JSON.parse(localStorage.getItem("ofresh_modele_aparate")||"[]")).map(x=>String(x).trim()).filter(Boolean))]}catch(e){return base}}
function addMachineModel(){const name=prompt("Introdu numele modelului nou:");if(!name||!name.trim())return;const clean=name.trim();const models=getMachineModels();if(!models.some(x=>x.toLowerCase()===clean.toLowerCase())){localStorage.setItem("ofresh_modele_aparate",JSON.stringify([...models,clean]));}const sel=document.getElementById("f_model");if(sel){sel.innerHTML=`<option value="">Selecteaza modelul</option>${getMachineModels().map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join("")}`;sel.value=clean}}
function v(k){const e=document.getElementById("f_"+k);return e?e.value.trim():""}
function plusYear(d){return plusMonths(d,12)}
function plusMonths(d,m){if(!d)return"";const x=new Date(d);x.setMonth(x.getMonth()+Number(m||0));return x.toISOString().slice(0,10)}

async function saveClient(old){
 const existing=(db.Locatii||[]).find(x=>String(x["ID Locatie"]||x.id||"").trim()===String(old||"").trim())||{};
 const id=String(old||"").trim()||uid("LOC");
 const rec={"ID Locatie":id,Client:v("client").trim(),"Nume locatie":v("client").trim(),Adresa:v("adresa").trim(),Zona:v("zona").trim(),Oras:v("oras").trim(),Judet:v("judet").trim(),"Persoana contact":v("contact").trim(),Telefon:v("telefon").trim(),Email:v("email").trim(),Latitudine:v("lat").trim(),Longitudine:v("lon").trim(),Status:existing.Status||"Activ",Observatii:v("obs").trim()};
 if(!rec.Client||!rec.Adresa)return msg("Completeaza Client si Adresa.",false);
 try{
   /* Daca ID-ul nu exista efectiv in Locatii, facem ADD, nu UPDATE. */
   const exists=!!(db.Locatii||[]).some(x=>String(x["ID Locatie"]||x.id||"").trim()===id);
   await rawSave("Locatii",rec,"ID Locatie",exists?id:"");
   closeModal();msg(exists?"Datele clientului au fost actualizate.":"Clientul a fost adaugat.");await load();
 }catch(e){msg(e.message||"Nu am putut salva clientul. Verifica conexiunea cu Google Sheets.",false)}
}
function machineTypeOptions(selected=""){

function captureTechInterventionDraft(){
  const root=document.getElementById("modalRoot");
  if(!root)return null;
  const controls={};
  root.querySelectorAll("input[id],select[id],textarea[id]").forEach(el=>{
    controls[el.id]={value:el.value,checked:!!el.checked,type:el.type};
  });
  return {controls};
}

function restoreTechInterventionDraft(draft){
  if(!draft||!draft.controls)return;
  const controls=draft.controls;
  const clientIdValue=controls.f_clientInterv?.value||"";
  const clientEl=document.getElementById("f_clientInterv");
  if(clientEl&&clientIdValue){
    clientEl.value=clientIdValue;
    clientEl.dispatchEvent(new Event("change"));
  }

  const tipEl=document.getElementById("f_tipInterventie");
  if(tipEl&&controls.f_tipInterventie){
    tipEl.value=controls.f_tipInterventie.value||"";
    toggleFilterFields();
  }

  Object.entries(controls).forEach(([id,state])=>{
    const el=document.getElementById(id);
    if(!el)return;
    if(state.type==="checkbox")el.checked=!!state.checked;
    else if(id!=="f_clientInterv" && id!=="f_aparatId")el.value=state.value??"";
  });

  const aparatValue=controls.f_aparatId?.value||"";
  const aparatEl=document.getElementById("f_aparatId");
  if(aparatEl&&aparatValue){
    aparatEl.value=aparatValue;
    if(aparatEl.tagName==="SELECT")showSelectedMachineCorrection();
  }

  const dataEl=document.getElementById("f_data");
  if(dataEl&&controls.f_data)dataEl.value=controls.f_data.value||"";
  const nextEl=document.getElementById("f_urmatoare");
  if(nextEl&&controls.f_urmatoare)nextEl.value=controls.f_urmatoare.value||"";
  const obsEl=document.getElementById("f_obs");
  if(obsEl&&controls.f_obs)obsEl.value=controls.f_obs.value||"";
  const factEl=document.getElementById("f_fact");
  if(factEl&&controls.f_fact)factEl.checked=!!controls.f_fact.checked;
}

  const known=["TS 400","TS 200","ION 200 Cold - Ambient & Hot","ION 905 Cold & Ambient & Hot","Oasis","Borg & Overström","Borg & Overstrom"];

    </div>

  `,`Salveaza`,`saveTechMachineEdit(${JSON.stringify(machineId(m))})`);
}

async function saveTechMachineEdit(id){
  const m=(db.Aparate||[]).find(x=>String(machineId(x))===String(id));
  if(!m)return;
  const oldSerie=String(m["Serie Aparat"]||m.Serie||m.serie||"");
  const oldId=String(m["ID Aparat"]||m.id||"");
  const oldCode=String(m["Cod OFRESH"]||m.codOfresh||"");
  const newType=v("corrTip");
  const newSerie=v("corrSerie").trim();
  const newCode=v("corrCod").trim();
  if(!newType||!newSerie)return msg("Completeaza tipul si seria aparatului.",false);
  const rec={...m,"Cod OFRESH":newCode,"Tip aparat":newType,"Model":newType,"Serie Aparat":newSerie,"Serie":newSerie};
  let idField="Serie Aparat", old=oldSerie;
  if(oldId){idField="ID Aparat";old=oldId;}
  else if(oldSerie){idField="Serie Aparat";old=oldSerie;}
  else if(oldCode){idField="Cod OFRESH";old=oldCode;}
  else return msg("Aparatul nu are un identificator pentru salvare.",false);
  const btn=document.querySelector("#modalRoot .modalFooter .primaryButton");
  if(btn){btn.disabled=true;btn.textContent="Se salveaza...";}
  try{
    await rawSave("Aparate",rec,idField,old);
    const idx=(db.Aparate||[]).findIndex(x=>x===m);
    if(idx>=0) db.Aparate[idx]={...db.Aparate[idx],...rec};
    saveCachedData();

    const draft=window.__ofreshTechInterventionDraft;
    if(btn){btn.disabled=false;btn.textContent="Salveaza";}
    closeModal();

    // Re-deschidem aceeasi fisa de interventie, cu acelasi client si acelasi aparat,
    // astfel incat tehnicianul sa poata continua task-urile exact de unde a ramas.
    if(draft){
      const clientValue=draft.controls?.f_clientInterv?.value||"";
      const clientObj=(db.Clienti||[]).find(c=>String(clientId(c))===String(clientValue));
      const existing={
        "ID Client":clientValue,
        "Client":clientObj?clientName(clientObj):"",
        "Tehnician":draft.controls?.f_tehnician?.value||techSession?.name||"",
        "Data":draft.controls?.f_data?.value||"",
        "Tip interventie":draft.controls?.f_tipInterventie?.value||"",
        "Urmatoarea interventie":draft.controls?.f_urmatoare?.value||"",
        "De facturat":draft.controls?.f_fact?.checked?"DA":"",
        "Observatii":draft.controls?.f_obs?.value||"",
        "ID Aparat":String(machineId(rec))
      };
      openIntervention(existing);
      restoreTechInterventionDraft(draft);
      window.__ofreshTechInterventionDraft=null;
    }

    msg("Aparatul a fost actualizat. Ai ramas pe aceeasi interventie si acelasi aparat.");
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent="Salveaza";}
    msg(e.message||"Nu am putut salva modificarile aparatului.",false)
  }
}

function openAdminLogin(){
  modal("Acces Administrator",`<div>
    ${inputField("User / Telefon","adminTelefon","","text")}
    ${inputField("PIN / Parola","adminPin","","password")}
  </div>`,`Intra in Administrator`,`loginAdministrator()`);
  setTimeout(()=>{
    const submit=ev=>{
      if(ev.key==="Enter"||ev.keyCode===13){
        ev.preventDefault();
        ev.stopImmediatePropagation();
        if(window.__ofreshAdminLoginBusy)return;
        window.__ofreshAdminLoginBusy=true;
        Promise.resolve(loginAdministrator()).finally(()=>window.__ofreshAdminLoginBusy=false);
      }
    };
    const user=document.getElementById("f_adminTelefon"), pin=document.getElementById("f_adminPin");
    user?.addEventListener("keydown",submit,true);
    pin?.addEventListener("keydown",submit,true);
    user?.focus();
  },50);
}
async function loginAdministrator(){
  const rawTelefon=String(document.getElementById("f_adminTelefon")?.value||"").trim();
  const pin=String(document.getElementById("f_adminPin")?.value||"").trim();
  const normalizePhone=x=>{let n=String(x??"").trim().replace(/\s+/g,"").replace(/-/g,"");if(/^0040/.test(n))n="0"+n.slice(4);else if(/^\+40/.test(n))n="0"+n.slice(3);return n;};
  const telefon=normalizePhone(rawTelefon);
  if(!rawTelefon||!pin)return msg("Completeaza userul/telefonul si PIN-ul.",false);
  const isActive=x=>{const st=String(x?.Status||x?.status||"Activ").trim().toLowerCase();return st!=="inactiv"&&st!=="inactive"};
  const matchesAdmin=x=>{
    if(!x||!isActive(x)||!userIsAdmin(x))return false;
    const storedPhone=normalizePhone(x.Telefon||x.telefon||"");
    const loginNames=[x.Username,x.username,x.User,x.user,x.Nume,x.nume,x["Nume utilizator"],x["ID Utilizator"]].map(z=>String(z??"").trim().toLowerCase()).filter(Boolean);
    const login=rawTelefon.toLowerCase();
    return ((storedPhone&&storedPhone===telefon)||loginNames.includes(login)||loginNames.includes(telefon.toLowerCase())) && userPin(x)===pin;
  };
  const openAdmin=(u)=>{adminSession=u;commercialSession=null;techSession=null;closeModal();enterAdminCleanMode();current="dashboard";render();load(true);};
  const localUser=(db.Utilizatori||[]).find(matchesAdmin);
  if(localUser){openAdmin(localUser);return;}
  if(rawTelefon.toLowerCase()==="admin" && pin==="1234"){openAdmin({"ID Utilizator":"ADMIN","Nume":"Administrator","Telefon":"admin","Rol":"administrator","Status":"Activ"});return;}
  try{
    const r=await api({action:"loginUser",telefon:telefon,user:rawTelefon,username:rawTelefon,pin:pin});
    if(r&&r.success&&r.user){if(!userIsAdmin(r.user))throw new Error("Contul nu are acces Administrator.");openAdmin(r.user);return;}
    if(r?.error)throw new Error(r.error);
  }catch(e){
    try{const data=await api({action:"read"});const users=Array.isArray(data?.Utilizatori)?data.Utilizatori:[];const found=users.find(matchesAdmin);if(found){openAdmin(found);return;}}catch(ignore){}
    msg(e.message||"User sau PIN incorect.",false);return;
  }
  msg("User sau PIN incorect.",false);
}

const publicParams=new URLSearchParams(location.search);
restoreCachedData();
if(publicParams.get("public")==="1"&&publicParams.get("serie")){publicMachinePage(publicParams.get("serie"));}
else {
  if(false && "serviceWorker" in navigator && location.protocol!=="file:"){navigator.serviceWorker.register("ofresh-sw.js").catch(()=>{});}
  if(location.hash.includes("access_token=") || location.hash.includes("type=recovery") || location.hash.includes("error_code=")){ initPasswordRecovery(); }
  else if(publicParams.get("tehnician")==="1"){setTimeout(openTechLogin,50);}
  else if(publicParams.get("comercial")==="1"){setTimeout(openCommercial,50);}
  else if(publicParams.get("administrator")==="1"||publicParams.get("admin")==="1"){setTimeout(openAdminLogin,50);}
  else if((window.matchMedia && window.matchMedia("(max-width: 768px)").matches) || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)){setTimeout(openTechLogin,50);}
  else{showAccessPage();}
}

<script>
/* OFRESH GLOBAL ENTER HANDLER */
(function(){
  if(window.__ofreshEnterHandlerInstalled)return;
  window.__ofreshEnterHandlerInstalled=true;
  document.addEventListener("keydown",function(ev){
    if(ev.key!=="Enter"&&ev.keyCode!==13)return;
    const id=ev.target&&ev.target.id||""; let fn=null,busy="";
    if(id==="f_loginTelefon"||id==="f_loginPin"){fn=loginTechnician;busy="__ofreshLoginBusy";}
    else if(id==="f_commercialTelefon"||id==="f_commercialPin"){fn=loginCommercial;busy="__ofreshCommercialLoginBusy";}
    else if(id==="f_adminTelefon"||id==="f_adminPin"){fn=loginAdministrator;busy="__ofreshAdminLoginBusy";}
    if(!fn)return; ev.preventDefault(); ev.stopImmediatePropagation(); if(window[busy])return; window[busy]=true; Promise.resolve(fn()).finally(()=>window[busy]=false);
  },true);
})();
</script>
