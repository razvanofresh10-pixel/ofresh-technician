name: Deploy OFRESH Supabase Preview

on:
  push:
    branches:
      - supabase-preview
    paths:
      - "index.html"
      - "ofresh-manifest.json"
      - "icons/**"
      - ".github/workflows/deploy-ofresh-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ofresh-supabase-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload preview site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
