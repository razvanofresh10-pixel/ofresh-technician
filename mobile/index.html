<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d35"><link rel="manifest" href="./manifest.webmanifest"><title>OFRESH Mobile</title>
<style>
:root{font-family:Inter,system-ui,Arial;color:#182622;background:#f3f7f5}*{box-sizing:border-box}body{margin:0}header{background:#123d35;color:white;padding:18px 18px 22px;border-radius:0 0 22px 22px}header strong{font-size:20px;letter-spacing:.5px}header small{display:block;opacity:.8;margin-top:4px}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid #e1eae5;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 16px #183b2c0a}.hidden{display:none!important}label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}input,select,textarea{width:100%;padding:13px;border:1px solid #ccd9d2;border-radius:10px;font:inherit;background:#fff}textarea{min-height:80px}button{border:0;border-radius:11px;background:#176b55;color:white;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:12px}button.secondary{background:#e8f1ed;color:#174c3d}button.danger{background:#9c3434}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#66756e;font-size:13px}.item{padding:13px;border:1px solid #e2ebe6;border-radius:12px;margin:8px 0}.item b{display:block}.pill{display:inline-block;background:#e7f3ed;color:#176047;border-radius:99px;padding:4px 9px;font-size:12px}.check{display:flex;gap:10px;align-items:center;padding:9px 0}.check input{width:auto}.status{padding:10px;border-radius:10px;background:#edf4f0;color:#234b3c;margin:10px 0;font-size:14px;white-space:pre-wrap}.error{background:#fff0ef;color:#8a2828}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.topline button{width:auto;margin:0;padding:9px 12px}.scan{font-size:28px;text-align:center;padding:18px}.footer{padding:24px;text-align:center;color:#718078;font-size:12px}
</style></head><body>
<header><strong>OFRESH VENDING SOLUTIONS</strong><small>Aplicatie mobila · Tehnicieni & Fileri</small></header>
<main class="wrap">
<section id="login" class="card"><h2>Autentificare</h2><p class="muted">Foloseste contul OFRESH alocat de administrator.</p><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="nume@ofresh.ro"><label>Parola</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Intra in aplicatie</button><div id="loginMsg" class="status hidden"></div></section>
<section id="app" class="hidden">
<div class="topline"><div><b id="who"></b><div class="muted" id="role"></div></div><button class="secondary" id="logout">Iesire</button></div>
<div id="techPanel" class="hidden">
<div class="card"><h2>Interventie tehnica</h2><label>Cauta aparat / Cod OFRESH</label><div class="grid"><input id="machineSearch" placeholder="Cod OFRESH sau serie"><button id="searchMachine">Cauta aparat</button></div><button class="secondary scan" id="scanBtn">▣ Scaneaza QR</button><input id="qrFile" type="file" accept="image/*" capture="environment" class="hidden"><div id="machineResult" class="muted"></div>
<label>Tip interventie</label><select id="visitType"><option value="">Selecteaza</option><option>Solicitare client</option><option>Mentenanta</option><option>Igienizare</option><option>Schimbare filtru</option><option>Verificare aparat testare</option><option>Curatare rezervor</option><option>Inlocuit piese</option></select>
<div id="filterFields" class="hidden"><label>Tip filtru schimbat</label><select id="filterType"><option value="">Selecteaza filtrul</option><option>Brita</option><option>BWT</option><option>FLUUX</option><option>Oasis</option><option>Alt tip de filtru</option></select><div class="grid"><div><label>Data montarii</label><input id="filterMountDate" type="date"></div><div><label>Interval (luni)</label><select id="filterMonths"><option value="6">6 luni</option><option value="12">12 luni</option></select></div></div></div><label>Operatiuni efectuate</label><textarea id="operations" placeholder="Descrie operatiunile efectuate"></textarea><label>Observatii</label><textarea id="notes"></textarea><label>Fotografii (max. 5 MB total; JPG/PNG/WEBP)</label><input id="techPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple><button id="saveTech">Salveaza interventia</button><div id="techMsg" class="status hidden"></div></div>
</div>
<div id="filerPanel" class="hidden">
<div class="card"><h2>Service espressoare</h2><label>Cauta client, cod OFRESH sau serie</label><input id="filerSearch" placeholder="Cauta in aparatele alocate"><div id="filerResults"></div></div>
<div id="filerVisit" class="card hidden"><h3 id="filerMachineTitle">Interventie filer</h3><div id="filerMachineInfo" class="muted"></div><label>Operatiuni</label>
<div id="filerTasks"></div><label>Observatii</label><textarea id="filerNotes"></textarea><label>Fotografii (maxim 5)</label><input id="filerPhotos" type="file" accept="image/jpeg,image/png,image/webp" multiple><button id="saveFiler">Salveaza interventia si fotografiile</button><div id="filerMsg" class="status hidden"></div></div>
</div>
</section>
<div class="footer">OFRESH Online · Conectat la Supabase Preview</div></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://zlbgxeaasctnfmjsrvql.supabase.co';
const SUPABASE_KEY='sb_publishable_a02U8Z2mHoP80mvDATdHHg_8PxojMYb';
const API=SUPABASE_URL+'/functions/v1/ofresh-preview-api';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
let profile=null, role='', selectedMachine=null, filerMachines=[], currentFilerMachine=null;
const $=id=>document.getElementById(id);
const show=(id,on=true)=>$(id).classList.toggle('hidden',!on);
function message(id,msg,error=false){$(id).textContent=msg;show(id,true);$(id).classList.toggle('error',error)}
async function api(action,data={}){const {data:{session}}=await sb.auth.getSession();const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY,'x-ofresh-role':role},body:JSON.stringify({action,...data})});const json=await res.json();if(!res.ok||json.success===false)throw new Error(json.error||'Eroare API');return json}
async function loadProfile(){const r=await api('whoami');profile=r.profile;role=String(profile.rol||'').toLowerCase();$('who').textContent=profile.nume||profile.email||'Utilizator';$('role').textContent='Rol: '+role;show('login',false);show('app');show('techPanel',role==='tehnician'||role==='administrator'||role==='admin');show('filerPanel',role==='filer'||role==='administrator'||role==='admin');if(role==='tehnician'||role==='administrator'||role==='admin')await loadTechData();if(role==='filer'||role==='administrator'||role==='admin')await loadFilerData()}
$('loginBtn').onclick=async()=>{try{$('loginBtn').disabled=true;message('loginMsg','Se verifica datele de autentificare...');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await loadProfile()}catch(e){message('loginMsg',e.message,true)}finally{$('loginBtn').disabled=false}};
$('logout').onclick=async()=>{await sb.auth.signOut();profile=null;show('app',false);show('login')};
async function loadTechData(){const r=await api('technicianData');$('machineResult').textContent='Date incarcate: '+(r.Aparate||[]).length+' aparate active/inregistrate.'}
function machineText(m){return [m.Client,m['Cod OFRESH'],m.Producator,m.Model,m.Serie,m.Adresa,m.Zona].filter(Boolean).join(' · ')}
async function findMachine(code){const r=await api('findAparat',{codOfresh:code});if(!r.found)throw new Error('Aparatul nu a fost gasit sau nu ai acces.');return r.aparat}
$('searchMachine').onclick=async()=>{try{const m=await findMachine($('machineSearch').value.trim());selectedMachine=m;$('machineResult').innerHTML='<b>'+escapeHtml(machineText(m))+'</b><br><span class="pill">Aparat selectat</span>'}catch(e){message('techMsg',e.message,true)}};
$('visitType').onchange=()=>show('filterFields',$('visitType').value==='Schimbare filtru');$('filterMountDate').value=new Date().toISOString().slice(0,10);$('scanBtn').onclick=()=>{$('qrFile').click()};
$('qrFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(!('BarcodeDetector'in window))throw new Error('Scanarea QR nu este suportata de acest browser. Introdu manual Cod OFRESH sau seria.');const bmp=await createImageBitmap(f);const detector=new BarcodeDetector({formats:['qr_code']});const codes=await detector.detect(bmp);if(!codes.length)throw new Error('Nu am gasit un cod QR in fotografie.');$('machineSearch').value=codes[0].rawValue; $('searchMachine').click()}catch(err){message('techMsg',err.message,true)}};
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function shrink(file){const img=await createImageBitmap(file);const scale=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.78));if(blob.size>1450000)blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.58));if(blob.size>1500000)throw new Error('Fotografia este prea mare.');return blob}
function b64(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(blob)})}
async function sendChunks(actionBase,visitId,token,file,index,category){const blob=await shrink(file),base=await b64(blob),chunkSize=28000,total=Math.ceil(base.length/chunkSize),uploadId=crypto.randomUUID().replace(/-/g,'');for(let i=0;i<total;i++){const chunk=base.slice(i*chunkSize,(i+1)*chunkSize);await api(actionBase,{visitId,photoToken:token,uploadId,chunk,chunkIndex:i,totalChunks:total,photoIndex:index})}return {uploadId,totalChunks:total,photoIndex:index,category,mimeType:'image/jpeg',fileName:file.name||'ofresh.jpg'}}
$('saveTech').onclick=async()=>{try{if(!selectedMachine)throw new Error('Selecteaza mai intai aparatul.');const type=$('visitType').value;if(!type)throw new Error('Selecteaza tipul interventiei.');const record={'ID Aparat':selectedMachine.id,'Tip interventie':type,'Tip':type,'Operatiuni efectuate':$('operations').value,'Observatii':$('notes').value,'ID Interventie':crypto.randomUUID()};const r=await api('add',{sheet:'Interventii',record});const visitId=r.record?.['ID Interventie']||r.record?.id;if(type==='Schimbare filtru'){const ft=$('filterType').value;if(!ft)throw new Error('Selecteaza tipul filtrului schimbat.');const mount=$('filterMountDate').value;const months=Number($('filterMonths').value);const due=new Date(mount+'T12:00:00');due.setMonth(due.getMonth()+months);await api('technicianCompleteFilterChange',{interventionId:visitId,tipFiltru:ft,dataMontare:mount,dataUrmatoareiSchimbari:due.toISOString().slice(0,10),intervalLuni:months})}if(!$('techPhotos').files.length){message('techMsg','Interventia a fost salvata in Supabase. ID: '+visitId);return}for(let i=0;i<$('techPhotos').files.length;i++){const f=$('techPhotos').files[i];const blob=await shrink(f);const base=await b64(blob),chunkSize=28000,total=Math.ceil(base.length/chunkSize),uploadId=crypto.randomUUID().replace(/-/g,'');for(let j=0;j<total;j++)await api('uploadPhotoChunk',{uploadId,chunk:base.slice(j*chunkSize,(j+1)*chunkSize),chunkIndex:j,totalChunks:total});await api('finalizePhotoUpload',{interventionId:visitId,uploadId,totalChunks:total,mimeType:'image/jpeg',fileName:f.name,photoIndex:i+1})}message('techMsg','Interventia si fotografiile au fost salvate in Supabase. ID: '+visitId)}catch(e){message('techMsg',e.message,true)}};
const tasks=['Igienizare','Decalcifiere','Curatare capucinator','Spalat grup cafea','Spalat furtune lapte','Spalat tavita reziduuri','Predat marfa'];
async function loadFilerData(){const r=await api('filerData');filerMachines=r.locations.flatMap(l=>l.machines.map(m=>({...m,_location:l})));renderFiler('')}
function renderFiler(q){const found=filerMachines.filter(m=>machineText(m).toLowerCase().includes(q.toLowerCase()));$('filerResults').innerHTML=found.slice(0,80).map((m,i)=>'<div class="item"><b>'+escapeHtml(m.Client||m._location.Client)+'</b><span class="muted">'+escapeHtml(machineText(m))+'</span><button class="secondary" data-machine="'+escapeHtml(m['ID Aparat'])+'">Selecteaza</button></div>').join('')||'<p class="muted">Nu exista rezultate in aria alocata.</p>';$('filerResults').querySelectorAll('button[data-machine]').forEach(b=>b.onclick=()=>openFilerMachine(b.dataset.machine))}
$('filerSearch').oninput=e=>renderFiler(e.target.value);
function openFilerMachine(id){currentFilerMachine=filerMachines.find(m=>m['ID Aparat']===id);if(!currentFilerMachine)return;$('filerMachineTitle').textContent=currentFilerMachine.Client||currentFilerMachine._location.Client;$('filerMachineInfo').textContent=machineText(currentFilerMachine);$('filerTasks').innerHTML=tasks.map(t=>'<label class="check"><input type="checkbox" value="'+t+'"> '+t+'</label>').join('');$('filerPhotos').value='';$('filerNotes').value='';show('filerVisit')}
$('saveFiler').onclick=async()=>{try{if(!currentFilerMachine)throw new Error('Selecteaza un aparat.');const selected=[...$('filerTasks').querySelectorAll('input:checked')].map(x=>x.value);if(!selected.length)throw new Error('Selecteaza cel putin o operatiune.');const files=[...$('filerPhotos').files];if(files.length>5)throw new Error('Sunt permise maximum 5 fotografii.');message('filerMsg','Salvez interventia...');const r=await api('filerSaveVisit',{machineId:currentFilerMachine['ID Aparat'],tasks:selected,observatii:$('filerNotes').value,photoCount:files.length});if(files.length){const uploads=[];for(let i=0;i<files.length;i++)uploads.push(await sendChunks('filerUploadPhotoChunk',r.visitId,r.photoToken,files[i],i+1,i===0?'Aviz':'Aparat dupa curatare'));await api('filerFinalizePhotoUploads',{visitId:r.visitId,photoToken:r.photoToken,photos:uploads})}message('filerMsg','Interventia si '+files.length+' fotografii salvate in Supabase. ID: '+r.visitId)}catch(e){message('filerMsg',e.message,true)}};
const {data:{session}}=await sb.auth.getSession();if(session){try{await loadProfile()}catch{await sb.auth.signOut();show('login')}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
