.commercialBrandClean{display:flex;align-items:center;gap:16px;min-width:0}.commercialBrandClean img{width:150px;height:auto;display:block}.commercialEyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:#1679bd}.commercialBrandClean h2{margin:3px 0 2px;font-size:25px}.commercialBrandClean p{margin:0;color:#667782}.commercialHeaderClean .secondaryButton{white-space:nowrap}
@media(max-width:700px){.commercialHeaderClean{align-items:flex-start;flex-direction:column}.commercialBrandClean img{width:125px}.commercialHeaderClean .secondaryButton{width:100%}}

/* Panou Comercial in dashboard Administrator */
.dashCommercialV37{background:#fff;border:1px solid #dce7eb;border-radius:18px;padding:18px;box-shadow:0 6px 18px rgba(24,67,85,.045)}
.dashCommercialHeadV37{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.dashCommercialHeadV37 h3{margin:0;color:#173642;font-size:18px}.dashCommercialHeadV37 p{margin:3px 0 0;color:#75868e;font-size:12px}.dashCommercialHeadV37 button{border:0;background:#20977f;color:#fff;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer}
.dashCommercialGridV37{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}.dashCommercialCardV37{border:1px solid #dce7eb;border-radius:14px;padding:14px;background:linear-gradient(180deg,#fff 0%,#f8fcfb 100%)}.dashCommercialCardV37 strong{display:block;font-size:22px;color:#17352f}.dashCommercialCardV37 span{display:block;font-size:11px;color:#71817d;margin-top:5px}.dashCommercialCardV37.alert strong{color:#d45a28}.dashCommercialFootV37{display:flex;flex-wrap:wrap;gap:10px;margin-top:13px}.dashCommercialFootV37 span{padding:8px 11px;border-radius:9px;background:#f2f7f5;color:#42615a;font-size:11px;font-weight:700}
@media(max-width:900px){.dashCommercialGridV37{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.dashCommercialHeadV37{align-items:flex-start;flex-direction:column}.dashCommercialHeadV37 button{width:100%}.dashCommercialGridV37{grid-template-columns:1fr}}

function buildClientsFromMachines(machines){
  const rows=Array.isArray(machines)?machines:[];
  const map=new Map();
  for(const m of rows){
    const name=String(m.Client||m.client||m["Nume client"]||m["Nume locatie"]||m.Locatie||m.locatie||"").trim();
    if(!name) continue;
    const address=String(m.Adresa||m.adresa||"").trim();
    const zone=String(m.Zona||m.zona||"").trim();
    const city=String(m.Oras||m.oras||"").trim();
    const county=String(m.Judet||m.judet||"").trim();
    const key=[name.toLowerCase(),city.toLowerCase(),county.toLowerCase(),city||county?"":address.toLowerCase()].join("|");

      const virtualId="AUTO-"+btoa(unescape(encodeURIComponent(key))).replace(/[^A-Za-z0-9]/g,"").slice(0,28);

function restoreCachedData(){
  try{
    const raw=localStorage.getItem("ofresh_db_cache_v23");
    if(!raw)return false;
    const cached=JSON.parse(raw);
    if(!cached || typeof cached!=="object")return false;
    db={Locatii:[],Clienti:[],Aparate:[],Interventii:[],Filtre:[],Stoc:[],Tehnicieni:[],Utilizatori:[],...cached};
    return true;
  }catch(e){return false;}
}
function saveCachedData(){
  try{
    const payload={Locatii:db.Locatii||[],Clienti:db.Clienti||[],Aparate:db.Aparate||[],Interventii:db.Interventii||[],Filtre:db.Filtre||[],Stoc:db.Stoc||[],Tehnicieni:db.Tehnicieni||[],Utilizatori:db.Utilizatori||[]};
    const raw=JSON.stringify(payload);
    if(raw.length<4500000)localStorage.setItem("ofresh_db_cache_v23",raw);
  }catch(e){}
}
async function load(background=false){
  try{
    const data=await api({action:"read"});
    db={Locatii:[],Clienti:[],Aparate:[],Interventii:[],Filtre:[],Stoc:[],Tehnicieni:[],...data};
    /* Clientii reali sunt in Locatii. Daca Locatii este goala, ii construim automat din Aparate. */
    const realLocatii=Array.isArray(data.Locatii)?data.Locatii:[];
    const autoClients=buildClientsFromMachines(data.Aparate||[]);
    db.Locatii=realLocatii;
    // Nu alegem intre Locatii si Aparate: combinam ambele surse, astfel incat
    // tehnicianul sa vada clientii chiar daca foaia Locatii este incompleta.
    const clientMap=new Map();
    for(const c of [...realLocatii,...autoClients]){
      const name=clientName(c).trim();
      if(!name) continue;
      const city=String(c.Oras||c.oras||"").trim().toLowerCase();
      const county=String(c.Judet||c.judet||"").trim().toLowerCase();
      const address=String(c.Adresa||c.adresa||"").trim().toLowerCase();
      const key=name.toLowerCase()+"|"+city+"|"+county+(city||county?"":"|"+address);
      if(!clientMap.has(key)) clientMap.set(key,c);
      else {
        const x=clientMap.get(key);
        for(const k of ["Adresa","Zona","Oras","Judet","Telefon","Email","Latitudine","Longitudine"]){ if(!x[k] && c[k]) x[k]=c[k]; }
      }
    }
    db.Clienti=[...clientMap.values()];
    saveCachedData();
    // Nu inlocuim ecranul tehnicianului daca acesta este deja in cautarea clientilor.
    // load() poate termina la cateva secunde dupa login si nu trebuie sa-l scoata din cautare.
    if(techSession && !adminSession){
      if(techView==="clients" && document.getElementById("techClientResults")){
        const q=String(document.getElementById("techClientSearch")?.value||"").trim().toLowerCase();
        const rows=(db.Clienti||[]).filter(l=>{
          if(!q)return true;
          const hay=[clientName(l),l.Adresa||l.adresa||"",l.Oras||l.oras||"",l.Judet||l.judet||"",l.Zona||l.zona||""].join(" ").toLowerCase();
          return hay.includes(q);
        });
        renderTechClientCards(rows);
      }else{
        techView="home";
        showTechnicianHome();
      }
    }else{
      render();
    }
  }catch(e){
    if(!background){
      document.getElementById("app").innerHTML='<div class="panel"><div class="empty">Nu pot incarca datele din Google Sheet.<br><br>'+esc(e.message)+'<br><br><button class="primaryButton" onclick="load()">Reincearca</button></div></div>';
      msg(e.message,false);
    }
  }
}

async function loginTechnician(){
  const phone=v("loginTelefon").replace(/\s+/g,"").replace(/-/g,"");
  const pin=v("loginPin").trim();
  const err=document.getElementById("techLoginError");
  const showTechError=(message)=>{if(err){err.textContent=message;err.style.display="block";}else{msg(message,false)}};
  if(!phone||!pin){showTechError("Completeaza telefonul si PIN-ul.");return false;}
  if(err)err.style.display="none";
  try{
    const r=await api({action:"login",telefon:phone,pin:pin});
    if(!r||!r.success)throw new Error(r?.error||"Telefonul sau PIN-ul este gresit.");
    const t=r.technician||{};
    techSession={id:t.id||t["ID Tehnician"]||"",name:t.nume||t.Nume||t["Nume tehnician"]||"",phone:t.telefon||t.Telefon||phone};
    try{localStorage.setItem("ofresh_tech_session",JSON.stringify(techSession));}catch(e){}
    techView="home";
    document.getElementById("techLoginScreen")?.remove();
    document.body.classList.remove("techLoginActive");
    const hadCache=restoreCachedData();
    showTechnicianHome();
    load(true);
    return true;
  }catch(e){showTechError(e.message||"Nu am putut valida accesul Tehnician.");return false}
}

function openNavigation(url){ try{ window.location.href=url; }catch(e){ window.open(url,'_self'); } return false; }
function openWazeNavigation(address,lat,lon){
  const a=String(address||'').trim();
  const la=String(lat||'').trim();
  const lo=String(lon||'').trim();
  if(!a && !(la&&lo)){ msg("Clientul nu are adresa sau coordonate GPS.",false); return false; }
  const hasGps=la && lo && !isNaN(Number(la)) && !isNaN(Number(lo));
  const params=hasGps
    ? 'll='+encodeURIComponent(la+','+lo)+'&navigate=yes&utm_source=ofresh_online'
    : 'q='+encodeURIComponent(a)+'&navigate=yes&utm_source=ofresh_online';
  const url='https://www.waze.com/ul?'+params;
  // Deschidem direct URL-ul, sincron cu click-ul. Nu lasam un tab gol sa astepte GPS.
  const w=window.open(url,'_blank','noopener,noreferrer');
  if(!w) window.location.href=url;
  return false;
}

function openMapsNavigation(address,lat,lon){
  const a=String(address||'').trim();
  const la=String(lat||'').trim();
  const lo=String(lon||'').trim();
  const hasDestinationGps=la && lo && !isNaN(Number(la)) && !isNaN(Number(lo));
  if(!a && !hasDestinationGps){ msg("Clientul nu are adresa sau coordonate GPS.",false); return false; }

  // NU asteptam geolocatia browserului. Google Maps stie sa foloseasca automat
  // locatia curenta a telefonului ca "Locatia ta". Astfel nu mai apare niciodata
  // un tab about:blank care ramane gol.
  const destination=hasDestinationGps ? la+','+lo : a;
  const url='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(destination)+'&travelmode=driving';
  const w=window.open(url,'_blank','noopener,noreferrer');
  if(!w) window.location.href=url;
  return false;
}

async function saveClientGPS(id){
  if(!navigator.geolocation)return msg("Browserul nu suporta localizarea GPS. Deschide OFRESH in Chrome/Safari, nu intr-un preview blocat.",false);
  const c=(db.Clienti||[]).find(x=>String(clientId(x))===String(id));
  if(!c)return msg("Clientul nu a fost gasit.",false);
  msg("Obtin pozitia ta GPS... accepta permisiunea de localizare daca apare.",true);
  const savePosition=async(pos)=>{
    try{
      const lat=Number(pos.coords.latitude), lon=Number(pos.coords.longitude), accuracy=Number(pos.coords.accuracy||0);
      if(!isFinite(lat)||!isFinite(lon))throw new Error("GPS invalid.");
      const real=(db.Locatii||[]).find(x=>String(clientId(x))===String(id));
      const locationId=real?clientId(real):(id||uid("LOC"));
      const rec={...(real||{}),"ID Locatie":locationId,Client:clientName(c),"Nume locatie":clientName(c),Adresa:c.Adresa||"",Zona:c.Zona||"",Oras:c.Oras||"",Judet:c.Judet||"",Latitudine:lat,Longitudine:lon,"GPS actualizat":new Date().toISOString(),"GPS precizie":accuracy,Status:real?.Status||"Activ"};
      await rawSave("Locatii",rec,"ID Locatie",real?String(locationId):"");
      for(const x of (db.Clienti||[]))if(String(clientId(x))===String(id)){x.Latitudine=lat;x.Longitudine=lon;x["GPS actualizat"]=rec["GPS actualizat"];x["GPS precizie"]=accuracy;}
      const localLoc=(db.Locatii||[]).find(x=>String(clientId(x))===String(locationId));
      if(localLoc){localLoc.Latitudine=lat;localLoc.Longitudine=lon;localLoc["GPS actualizat"]=rec["GPS actualizat"];localLoc["GPS precizie"]=accuracy;}
      saveCachedData();
      msg("GPS salvat: "+lat.toFixed(6)+", "+lon.toFixed(6)+" | precizie ~"+Math.round(accuracy)+" m.",true);
      const input=document.getElementById("techClientSearch"),q=String(input?.value||"").trim().toLowerCase();
      const rows=(db.Clienti||[]).filter(l=>!q||[clientName(l),l.Adresa||"",l.Oras||"",l.Judet||"",l.Zona||""].join(" ").toLowerCase().includes(q));
      renderTechClientCards(rows);
    }catch(e){msg(e.message||"Nu am putut salva pozitia GPS.",false)}
  };
  const retry=(err)=>{
    if(err && err.code===1){
      msg("Localizarea este blocata pentru acest site. In Chrome: lacatul din bara de adresa → Permisiuni → Localizare → Permite, apoi apasa din nou.",false);return;
    }
    if(err && err.code===3){
      msg("GPS-ul nu a raspuns la timp. Incerc din nou cu localizare normala...",true);
      navigator.geolocation.getCurrentPosition(savePosition,()=>msg("Nu pot obtine pozitia. Activeaza Localizarea telefonului si permisiunea pentru Chrome si incearca din nou.",false),{enableHighAccuracy:false,timeout:30000,maximumAge:10000});
      return;
    }
    msg("Nu pot obtine pozitia curenta. Verifica Localizarea telefonului si permisiunea pentru Chrome/Safari.",false);
  };
  navigator.geolocation.getCurrentPosition(savePosition,retry,{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}

async function saveTechnician(old={}){
  const name=v("tnume");
  if(!name)return msg("Completeaza numele tehnicianului.",false);
  const rec={"ID Tehnician":technicianId(old)||uid("TECH"),"Nume":name,"Telefon":v("ttelefon"),"PIN":v("tpin"),"Email":v("temail"),"Status":v("tstatus")||"Activ","Observatii":v("tobs"),"Data creare":old["Data creare"]||new Date().toISOString().slice(0,10)};
  try{
    // Tehnicienii existenti doar local nu exista inca in Google Sheet. In acest caz facem ADD, nu UPDATE.
    const remote=Array.isArray(db.Tehnicieni)?db.Tehnicieni:[];
    const existsRemote=remote.some(x=>String(technicianId(x)).trim()===String(rec["ID Tehnician"]).trim());
    await saveTechnicianCentral(rec,existsRemote?rec["ID Tehnician"]:"");
    const arr=getTechnicians().filter(x=>technicianId(x)!==rec["ID Tehnician"]); arr.unshift(rec); saveTechnicians(arr);
    closeModal();msg("Tehnician salvat in Google Sheet."); await load();
    if(technicianReturnToIntervention){ technicianReturnToIntervention=false; openIntervention(); }
  }catch(e){
    const arr=getTechnicians().filter(x=>technicianId(x)!==rec["ID Tehnician"]); arr.unshift(rec); saveTechnicians(arr);
    closeModal();msg("Eroare la sincronizarea cu Google Sheet: "+(e.message||e),false);
    if(technicianReturnToIntervention){ technicianReturnToIntervention=false; openIntervention(); } else techniciansPage();
  }
}

}

function commercialFindLocationForMachine(m){
  const locs=[...(commercialDb.Locatii||[]),...(commercialDb.Clienti||[])];
  const ids=[m&&m["ID Locatie"],m&&m.idLocatie,m&&m["ID Client"],m&&m.idClient].map(v=>String(v||"").trim()).filter(Boolean);
  const name=String(machineClient(m)||"").trim().toLowerCase();
  const addr=String(m&&m.Adresa||"").trim().toLowerCase();
  let x=locs.find(r=>ids.includes(String(r["ID Locatie"]||r["ID Client"]||r.idLocatie||r.idClient||clientId(r)||"").trim()));
  if(x && String(x.Judet||x.judet||x.County||x.county||"").trim()) return x;
  let byId=x;
  x=locs.find(r=>name && String(clientName(r)||r.Client||r.client||r.Nume||r["Nume locatie"]||"").trim().toLowerCase()===name && String(r.Judet||r.judet||r.County||r.county||"").trim());
  if(x)return x;
  if(byId)return byId;
  if(addr){
    x=locs.find(r=>String(r.Adresa||r.adresa||"").trim().toLowerCase()===addr && String(r.Judet||r.judet||r.County||r.county||"").trim());
    if(x)return x;
  }
  return {};
}

function normalizeCounty(v){return String(v||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}

function commercialCountyFromCity(v){const n=normalizeCounty(v);if(!n)return "";if(OFRESH_CITY_COUNTY[n])return OFRESH_CITY_COUNTY[n];if(n.startsWith("bucuresti"))return "Bucuresti";for(const [city,county] of Object.entries(OFRESH_CITY_COUNTY))if(n.includes(city))return county;return "";}

function commercialCountyForMachine(m){
  const direct=m&&(m.Judet||m.judet||m.County||m.county);

  const city=m&&(m.Oras||m.oras||m.City||m.city)||loc&&(loc.Oras||loc.oras)||"";

function openCommercial(){

  if(commercialSession){commercialTab='aparate';commercialPage();document.getElementById("pageTitle").textContent="Comercial";document.getElementById("crumb").textContent="Comercial";return;}
  modal("Acces Comercial",`<div>
    ${inputField("Telefon","commercialTelefon","","tel")}
    ${inputField("PIN","commercialPin","","password")}
  </div>`,`Intra in Comercial`,`loginCommercial()`);

    const submit=ev=>{
      if(ev.key==="Enter" || ev.keyCode===13){
        ev.preventDefault();
        ev.stopPropagation();
        if(window.__ofreshCommercialLoginBusy)return;

  },50);

async function loginCommercial(){
  const telefon=v("commercialTelefon").replace(/\s+/g,"").replace(/-/g,"");
  const pin=v("commercialPin").trim();
  if(!telefon||!pin)return msg("Completeaza telefonul si PIN-ul.",false);
  try{
    const r=await api({action:"commercialData",telefon:telefon,pin:pin});
    if(!r||!r.success)throw new Error(r?.error||"Telefonul sau PIN-ul este gresit.");
    commercialSession=r.user||{Telefon:telefon,Rol:"comercial"};
    commercialDb={Aparate:Array.isArray(r.data?.Aparate)?r.data.Aparate:[],Filtre:Array.isArray(r.data?.Filtre)?r.data.Filtre:[],Interventii:Array.isArray(r.data?.Interventii)?r.data.Interventii:[],Clienti:Array.isArray(r.data?.Clienti)?r.data.Clienti:[],Locatii:Array.isArray(r.data?.Locatii)?r.data.Locatii:[]};

function userRightsList(){return [
  ["Dashboard","Dashboard"],["Clienti","Clienti"],["Aparate","Aparate"],["Export Aparate","Export Aparate"],
  ["Interventii","Interventii"],["Filtre","Filtre / Istoric filtre"],["Stoc","Stoc"],["Tehnicieni","Tehnicieni"],
  ["Rapoarte","Rapoarte"],["Mod Tehnician","Mod Tehnician"],["Comercial","Modul Comercial"]
];}
function userId(x){return x?.["ID Utilizator"]||x?.id||""}
function userName(x){return x?.Nume||x?.nume||""}
function userPhone(x){return x?.Telefon||x?.telefon||""}
function userPin(x){return String(x?.PIN||x?.pin||"")}
function userRole(x){return String(x?.Rol||x?.rol||"").trim().toLowerCase()}
function userStatus(x){return x?.Status||x?.status||"Activ"}
function userRights(x){const raw=x?.Drepturi||x?.drepturi||"";return String(raw).split(/[,;|]/).map(v=>v.trim()).filter(Boolean)}
function userIsAdmin(x){return userRole(x)==="administrator"||userRole(x)==="admin"}
function roleDefaultRights(role){
  const r=String(role||"").trim().toLowerCase();
  if(r==="administrator"||r==="admin") return userRightsList().map(x=>x[0]);
  if(r==="comercial") return ["Aparate","Filtre","Comercial"];
  if(r==="tehnician") return ["Dashboard","Clienti","Aparate","Interventii","Mod Tehnician"];
  return [];
}
function applyRoleRights(role){
  const defaults=new Set(roleDefaultRights(role));
  document.querySelectorAll("[data-right]").forEach(cb=>{ cb.checked=defaults.has(cb.dataset.right); });
}
function openUser(r={}){
  const old=userId(r);
  const role=String(r.Rol||r.rol||"Comercial").trim().toLowerCase();
  const storedRights=old ? userRights(r) : [];
  const rights=role==="comercial"
    ? [...new Set([...storedRights,...roleDefaultRights(role)])]
    : (old ? storedRights : roleDefaultRights(role));
  const checks=userRightsList().map(([key,label])=>`<label class="checkRow"><input type="checkbox" id="right_${esc(key).replace(/[^A-Za-z0-9]/g,'_')}" data-right="${esc(key)}" ${rights.includes(key)?'checked':''}><span>${esc(label)}</span></label>`).join("");
  const roleSelect=`<div class="field"><label>Rol</label><select id="f_urole" onchange="applyRoleRights(this.value)"><option value="administrator" ${role==="administrator"||role==="admin"?'selected':''}>administrator</option><option value="comercial" ${role==="comercial"?'selected':''}>comercial</option><option value="tehnician" ${role==="tehnician"?'selected':''}>tehnician</option><option value="utilizator" ${role==="utilizator"?'selected':''}>utilizator</option></select></div>`;
  modal(old?"Modifica utilizator":"Adauga utilizator",`<div class="grid">
    ${inputField("Nume","unume",userName(r))}${inputField("Telefon","utelefon",userPhone(r),"tel")}
    ${inputField("PIN","upin",userPin(r),"password")}${inputField("Email","uemail",r.Email||r.email||"","email")}
    ${roleSelect}${selectField("Status","ustatus",userStatus(r),["Activ","Inactiv"])}
    ${inputField("Observatii","uobs",r.Observatii||r.observatii||"","text",true)}
    <div class="field wide"><span>Drepturi de acces</span><div class="checkList">${checks}</div><div class="hint"><strong>Administrator:</strong> toate drepturile sunt active. <strong>Comercial:</strong> Aparate, Filtre / Istoric filtre si Modul Comercial sunt bifate automat. Restul drepturilor pot fi acordate manual.</div></div>
  </div>`,`Salveaza utilizator`,`saveUser(${JSON.stringify(r)})`);
}
async function saveUser(old={}){
  const name=v("unume"), phone=v("utelefon"), pin=v("upin"), role=v("urole")||"comercial", status=v("ustatus")||"Activ";
  if(!name||!phone||!pin)return msg("Completeaza numele, telefonul si PIN-ul.",false);
  const rights=[...document.querySelectorAll('[data-right]:checked')].map(x=>x.dataset.right);
  const finalRights=(role==="administrator")?userRightsList().map(x=>x[0]):rights;
  const rec={"ID Utilizator":userId(old)||uid("USR"),"Nume":name,"Telefon":phone,"PIN":pin,"Email":v("uemail"),"Rol":role,"Status":status,"Observatii":v("uobs"),"Drepturi":finalRights.join(", "),"Data creare":old["Data creare"]||new Date().toISOString().slice(0,10)};
  try{const exists=(db.Utilizatori||[]).some(x=>String(userId(x))===String(rec["ID Utilizator"]));await rawSave("Utilizatori",rec,"ID Utilizator",exists?rec["ID Utilizator"]:"");closeModal();msg("Utilizator salvat.");await load();go("utilizatori");}catch(e){msg(e.message||"Nu am putut salva utilizatorul.",false)}
}
async function deleteUser(id){if(!id)return;if(!confirm("Sigur vrei sa stergi acest utilizator?"))return;const u=(db.Utilizatori||[]).find(x=>String(userId(x))===String(id));if(u&&userIsAdmin(u)&&((db.Utilizatori||[]).filter(userIsAdmin).length<=1))return msg("Nu poti sterge singurul administrator.",false);try{const r=await api({action:"delete",sheet:"Utilizatori",idField:"ID Utilizator",idValue:id});if(r&&r.success===false)throw new Error(r.error||"Eroare stergere");msg("Utilizator sters.");await load();go("utilizatori")}catch(e){msg(e.message||"Nu am putut sterge utilizatorul.",false)}}
function usersPage(){
 const arr=Array.isArray(db.Utilizatori)?db.Utilizatori:[];
 document.getElementById("app").innerHTML=pageHero("ADMINISTRARE ACCES","Utilizatori","Aici modifici inclusiv propriul cont de Administrator si alegi drepturile fiecarui utilizator.",`<button class="primaryButton" onclick="openUser()">+ Adauga utilizator</button>`)+`<section class="panel"><div class="notice"><strong>Important:</strong> Telefonul si PIN-ul de mai jos sunt datele cu care utilizatorul se autentifica. Daca iti schimbi propriul Telefon sau PIN, la urmatoarea autentificare vei folosi noile date.</div><br>${arr.length?`<div class="tableWrap userTableWrap"><table class="table userTable"><thead><tr><th>Nume</th><th>Telefon</th><th>Email</th><th>Rol</th><th>Status</th><th>Drepturi</th><th>Actiuni</th></tr></thead><tbody>${arr.map(x=>`<tr><td><strong>${esc(userName(x))}</strong></td><td>${esc(userPhone(x))}</td><td>${esc(x.Email||x.email||"")}</td><td>${esc(x.Rol||x.rol||"")}</td><td>${esc(userStatus(x))}</td><td>${esc(userRights(x).join(", ")||"-" )}</td><td><div class="right"><button class="secondaryButton" onclick='openUser(${JSON.stringify(x)})'>Modifica</button><button class="dangerButton" onclick='deleteUser(${JSON.stringify(userId(x))})'>Sterge</button></div></td></tr>`).join("")}</tbody></table></div>`:'<div class="emptyState">Nu exista utilizatori in foaia Utilizatori.</div>'}</section>`;
}

function closeModal(){
 const root=document.getElementById("modalRoot");if(root)root.innerHTML="";
 const side=document.querySelector(".sidebar");const main=document.querySelector(".main");
 if(side){side.style.removeProperty("display");side.style.removeProperty("visibility");delete side.dataset.techPrevDisplay;}
 if(main){main.style.removeProperty("margin-left");main.style.removeProperty("width");delete main.dataset.techPrevMargin;}

function inputField(label,key,val="",type="text",wide=false,extra=""){return `<label class="field ${wide?"wide":""}"><span>${esc(label)}</span><input id="f_${key}" type="${type}" value="${esc(val)}" ${extra}></label>`}
function selectField(label,key,val,opts,wide=false){return `<label class="field ${wide?"wide":""}"><span>${esc(label)}</span><select id="f_${key}"><option value="">Selecteaza</option>${opts.map(o=>`<option value="${esc(o)}" ${String(o)===String(val)?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`}
function clientInputField(val=""){const clients=(db.Clienti||[]).map(clientName).filter(Boolean);return `<label class="field"><span>Client</span><input id="f_client" list="clientList" value="${esc(val)}" autocomplete="off" placeholder="Scrie clientul, ex. MICRO"><datalist id="clientList">${clients.map(c=>`<option value="${esc(c)}"></option>`).join("")}</datalist></label>`}
function getMachineModels(){const base=["TS 400","TS 200"];try{return [...new Set(base.concat(JSON.parse(localStorage.getItem("ofresh_modele_aparate")||"[]")).map(x=>String(x).trim()).filter(Boolean))]}catch(e){return base}}
function addMachineModel(){const name=prompt("Introdu numele modelului nou:");if(!name||!name.trim())return;const clean=name.trim();const models=getMachineModels();if(!models.some(x=>x.toLowerCase()===clean.toLowerCase())){localStorage.setItem("ofresh_modele_aparate",JSON.stringify([...models,clean]));}const sel=document.getElementById("f_model");if(sel){sel.innerHTML=`<option value="">Selecteaza modelul</option>${getMachineModels().map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join("")}`;sel.value=clean}}
function v(k){const e=document.getElementById("f_"+k);return e?e.value.trim():""}
function plusYear(d){return plusMonths(d,12)}
function plusMonths(d,m){if(!d)return"";const x=new Date(d);x.setMonth(x.getMonth()+Number(m||0));return x.toISOString().slice(0,10)}
function openClient(r={}){const old=clientId(r);modal(old?"Modifica client":"Adauga client",`<div class="grid">${inputField("Client","client",clientName(r))}${inputField("Adresa","adresa",r.Adresa||r.adresa||"","text",true)}${inputField("Zona","zona",r.Zona||r.zona||"")}${inputField("Oras","oras",r.Oras||r.oras||"")}${selectField("Judet","judet",r.Judet||r.judet||"",["Alba","Arad","Arges","Bacau","Bihor","Bistrita-Nasaud","Botosani","Brasov","Braila","Bucuresti","Buzau","Caras-Severin","Calarasi","Cluj","Constanta","Covasna","Dambovita","Dolj","Galati","Giurgiu","Gorj","Harghita","Hunedoara","Ialomita","Iasi","Ilfov","Maramures","Mehedinti","Mures","Neamt","Olt","Prahova","Salaj","Satu Mare","Sibiu","Suceava","Teleorman","Timis","Tulcea","Vaslui","Valcea","Vrancea"])}${inputField("Persoana contact","contact",r["Persoana contact"]||r.contact||"")}${inputField("Telefon","telefon",r.Telefon||r.telefon||"","tel")}${inputField("Email","email",r.Email||r.email||"","email")}${inputField("Latitudine","lat",r.Latitudine||r.latitudine||"")}${inputField("Longitudine","lon",r.Longitudine||r.longitudine||"")}${inputField("Observatii","obs",r.Observatii||r.observatii||"","text",true)}</div>`,`Salveaza client`,`saveClient(${JSON.stringify(old)})`)}
async function saveClient(old){
 const existing=(db.Locatii||[]).find(x=>String(x["ID Locatie"]||x.id||"").trim()===String(old||"").trim())||{};
 const id=String(old||"").trim()||uid("LOC");
 const rec={"ID Locatie":id,Client:v("client").trim(),"Nume locatie":v("client").trim(),Adresa:v("adresa").trim(),Zona:v("zona").trim(),Oras:v("oras").trim(),Judet:v("judet").trim(),"Persoana contact":v("contact").trim(),Telefon:v("telefon").trim(),Email:v("email").trim(),Latitudine:v("lat").trim(),Longitudine:v("lon").trim(),Status:existing.Status||"Activ",Observatii:v("obs").trim()};
 if(!rec.Client||!rec.Adresa)return msg("Completeaza Client si Adresa.",false);
 try{
   /* Daca ID-ul nu exista efectiv in Locatii, facem ADD, nu UPDATE. */
   const exists=!!(db.Locatii||[]).some(x=>String(x["ID Locatie"]||x.id||"").trim()===id);

async function saveMachine(old){
  const existing=(db.Aparate||[]).find(x=>String(machineId(x)).trim()===String(old||'').trim())||{};
  const selectedClientId=String(v("client")).trim();
  const client=(db.Clienti||[]).find(c=>String(clientId(c)).trim()===selectedClientId)||null;
  const clientNameValue=client?clientName(client):String(document.getElementById("f_clientSearch")?.value||"").trim();
  const serie=v("serie").trim();
  const tip=v("tipAparat").trim();
  const cod=v("cod").trim();
  if(!clientNameValue||!tip||!serie)return msg("Completeaza clientul, tipul aparatului si seria.",false);

  const id=String(old||existing["ID Aparat"]||existing.id||"").trim()||uid("APR");
  const rec={
    ...existing,
    "ID Aparat":id,
    "Cod OFRESH":cod,
    "ID Client":client?clientId(client):(existing["ID Client"]||existing.idClient||""),
    "ID Locatie":client?clientId(client):(existing["ID Locatie"]||existing.idLocatie||""),
    "Client":clientNameValue,
    "Tip Echipament":v("tipEchipament"),
    "Tip aparat":tip,
    "Model":tip,
    "Serie Aparat":serie,
    "Serie":serie,
    "Adresa":v("adresa"),
    "Zona":v("zona"),
    "Producator":v("prod"),
    "Data instalare":v("instalare"),
    "Data Retragere":v("retragere"),
    "Status":v("status")||"Activ"
  };

  let idField="Cod OFRESH", idValue=cod;
  if(old){
    if(existing["Cod OFRESH"]){idField="Cod OFRESH";idValue=String(existing["Cod OFRESH"]);}
    else if(existing["Serie Aparat"]){idField="Serie Aparat";idValue=String(existing["Serie Aparat"]);}
    else {idField="Serie Aparat";idValue=serie;}
  }else{
    idField="Cod OFRESH"; idValue="";
  }

  const btn=document.getElementById("modalSaveBtn");
  if(btn){btn.disabled=true;btn.textContent="Se salveaza...";}

  // Actualizare instant in interfata: nu asteptam reincarcarea tuturor datelor.
  const idx=(db.Aparate||[]).findIndex(x=>String(machineId(x)).trim()===String(old||"").trim());
  if(idx>=0) db.Aparate[idx]={...db.Aparate[idx],...rec};
  else db.Aparate.push(rec);
  saveCachedData();
  closeModal();
  msg(old?"Aparatul a fost actualizat.":"Aparatul a fost adaugat.");

  // Salvarea in Google Sheets ruleaza in fundal, fara delay pentru utilizator.
  try{
    await rawSave("Aparate",rec,idField,idValue);
  }catch(e){
    // Revenim la mesaj de eroare, dar pastram datele locale pentru a nu pierde munca utilizatorului.
    msg((e&&e.message)||"Nu am putut salva aparatul in Google Sheets.",false);
  }
}

    if(idx>=0) db.Aparate[idx]={...db.Aparate[idx],...rec};

    const clientEl=document.getElementById("f_clientInterv");
    const clientValue=clientEl ? clientEl.value : "";
    const aparatValue=String(machineId(rec));
    // Reafiseaza selectorul aparatului in fisa curenta, pastrand selectia.
    const list=machinesForClient(clientValue);
    const root=document.getElementById("apparatusChooser");
    if(root){
      if(list.length===1){
        const mm=list[0];

          <div><span class="small">APARAT</span><strong class="machineTypeLarge">${esc(machineType(mm)||"Aparat")}</strong></div>

          <div id="selectedMachineActions" class="machineActionRow"></div>`;
        const ae=document.getElementById("f_aparatId");
        if(ae){ae.value=aparatValue; ae.addEventListener("change",showSelectedMachineCorrection);}
        showSelectedMachineCorrection();

async function compressInterventionImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=800;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        let quality=.42;
        const make=()=>canvas.toDataURL("image/jpeg",quality);
        let data=make();
        if(data.length>500000){quality=.55;data=make();}
        if(data.length>650000){quality=.40;data=make();}
        if(data.length>700000)return reject(new Error("Fotografia este prea mare. Selecteaza o fotografie mai mica."));
        resolve({dataUrl:data,mimeType:"image/jpeg",fileName:(file.name||"interventie.jpg").replace(/\.[^.]+$/i,"")+".jpg"});
      };

      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error("Nu am putut citi fotografia."));

  });
}

async function uploadInterventionPhotoFile(file,meta,index){
  const prepared=await compressInterventionImage(file);
  const base64=prepared.dataUrl.split(",")[1]||"";
  const uploadId="UPL-"+Date.now()+"-"+Math.random().toString(36).slice(2,9);
  const chunkSize=3000;
  const totalChunks=Math.ceil(base64.length/chunkSize);
  for(let i=0;i<totalChunks;i++){
    const chunk=base64.slice(i*chunkSize,(i+1)*chunkSize);
    const r=await api({action:"uploadPhotoChunk",uploadId,chunkIndex:i,totalChunks,chunk});
    if(r&&r.success===false)throw new Error(r.error||"Eroare la incarcarea fotografiei.");
  }
  const result=await api({action:"finalizePhotoUpload",uploadId,totalChunks,interventionId:meta.interventionId,client:meta.client,aparat:meta.aparat,tehnician:meta.tehnician,data:meta.data,photoIndex:index+1,fileName:prepared.fileName,mimeType:prepared.mimeType});
  if(!result||result.success===false)throw new Error(result?.error||"Fotografia nu a putut fi salvata.");
  return result;
}

function makePublicQrToken(key){
 const value=String(key||"").trim();
 if(!value)return "";
 // Token compact, opac pentru QR: nu afiseaza ID-ul/seria in clar si se decodeaza instant.
 try{
   const bytes=new TextEncoder().encode(value);
   let binary=""; for(const b of bytes)binary+=String.fromCharCode(b);
   return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"");
 }catch(e){return btoa(unescape(encodeURIComponent(value))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"");}
}
function decodePublicQrToken(token){
 try{
   let s=String(token||"").replace(/-/g,"+").replace(/_/g,"/");
   while(s.length%4)s+="=";
   const binary=atob(s);
   const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
   return new TextDecoder().decode(bytes);
 }catch(e){return "";}
}

function extractMachineKeyFromQR(raw){
 const text=String(raw??"").trim();
 if(!text)return "";
 // URL: acceptam m, aparat, serie, public/aparat si alte denumiri folosite de versiunile vechi.
 try{
   const u=new URL(text,location.href);
   const p=u.searchParams;
   const candidate=p.get("m")||p.get("aparat")||p.get("serie")||p.get("machine")||p.get("machineId")||p.get("id")||p.get("qr")||p.get("q")||p.get("cod")||p.get("code");
   if(candidate)return decodeURIComponent(candidate).trim();
   const pathParts=u.pathname.split("/").filter(Boolean);
   if(pathParts.length){
     const last=decodeURIComponent(pathParts[pathParts.length-1]).trim();
     if(pathParts.length>=2 && /^p$/i.test(pathParts[pathParts.length-2])) return last;
     if(last && last!=="index.html") return last;
   }
 }catch(e){}
 // JSON / format OFRESH: acceptam QR-uri mai vechi.
 try{
   const j=JSON.parse(text);
   const candidate=j.m||j.aparat||j.serie||j.machine||j.id||j["ID Aparat"]||j["Cod OFRESH"]||j["Serie Aparat"];
   if(candidate)return String(candidate).trim();
 }catch(e){}
 let v=text.replace(/^OFRESH[_:\-\s]*/i,"").trim(); if(/^https?:\/\//i.test(v))return ""; return v;
}

async function startMachineScanner(){

 try{
   machineQrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
   video.srcObject=machineQrStream; await video.play();
   if(status)status.textContent="Indreapta camera spre QR. Il citesc automat...";
   const canvas=document.getElementById("machineQrCanvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});
   const tick=()=>{
     if(!machineQrStream||!document.getElementById("machineQrVideo"))return;
     if(video.readyState>=2&&video.videoWidth&&video.videoHeight){
       const maxW=900,scale=Math.min(1,maxW/video.videoWidth);canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);ctx.drawImage(video,0,0,canvas.width,canvas.height);

       if(code?.data){openMachineFromQR(code.data);return;}
     }
     machineQrTimer=setTimeout(tick,180);
   };
   tick();

function renderPublicMachineData(data,key,isQrToken=false){
  const rows=Array.isArray(data?.Aparate)?data.Aparate:[];
  const wanted=String(key||"").trim();
  const normQR=v=>String(v??"").trim().toLowerCase().replace(/\s+/g,"").replace(/[–—-]/g,"");
  const wantedQR=normQR(wanted);
  let r=null;
  if(isQrToken){
    const decoded=decodePublicQrToken(wanted);
    if(decoded){
      r=rows.find(x=>[x["ID Aparat"],x.id,x.ID,x["Cod OFRESH"],x.codOfresh,x["Serie Aparat"],x.Serie,x.serie].some(v=>normQR(v)===normQR(decoded)))||null;
    }
  }else{
    r=rows.find(x=>[x["ID Aparat"],x.id,x.ID,x["Cod OFRESH"],x.codOfresh,x["Serie Aparat"],x.Serie,x.serie].some(v=>normQR(v)===wantedQR));
  }
  if(!r)return false;
  const filters=Array.isArray(data?.Filtre)?data.Filtre:[];
  const machineKey=String(r["ID Aparat"]||r["Cod OFRESH"]||r["Serie Aparat"]||"").trim();
  const related=filters.filter(x=>{
    const ids=[x["ID Aparat"],x["Cod OFRESH"],x["Serie Aparat"]].map(v=>String(v||"").trim()).filter(Boolean);
    return ids.includes(machineKey)||ids.includes(String(r["ID Aparat"]||"").trim())||ids.includes(String(r["Serie Aparat"]||"").trim());
  });
  const dated=related.filter(x=>x["Data montare"]||x["Data schimbare"]||x.dataSchimbare).sort((a,b)=>new Date(b["Data montare"]||b["Data schimbare"]||b.dataSchimbare)-new Date(a["Data montare"]||a["Data schimbare"]||a.dataSchimbare));
  const f=related.find(x=>String(x.Status||"Activ").toLowerCase()!=="inactiv")||dated[0]||{};
  const last=dated[0]?.["Data montare"]||dated[0]?.["Data schimbare"]||dated[0]?.dataSchimbare||"";
  const next=f["Data urmatoarei schimbari"]||f["Data urmatoare schimbare"]||f.urmatorSchimb||"";
  let days="";if(next){const d=new Date(next);if(!isNaN(d))days=Math.ceil((d-new Date())/86400000)}
  const status=days===""?"":days<0?"DEPASIT":days<=15?"SCHIMBARE APROPIATA":"IN TERMEN";
  document.body.innerHTML=`<div class="techOverlay"><div class="techLogin" style="max-width:620px"><div class="techLogo">OFRESH</div><div class="eyebrow">INFORMATII FILTRU</div><h2>${esc(r.Client||machineClient(r)||"")}</h2><div class="panel" style="margin:15px 0;text-align:left"><p><strong>Aparat:</strong> ${esc(r["Tip aparat"]||r.Model||"")}</p><p><strong>Serie:</strong> ${esc(r["Serie Aparat"]||r.Serie||"")}</p><p><strong>Zona:</strong> ${esc(r.Zona||"")}</p><p><strong>Tip filtru:</strong> ${esc(f["Tip filtru"]||f.tipFiltru||"")}</p><p><strong>Ultimul schimb de filtru:</strong> ${esc(last||"Nu exista inregistrare")}</p><p><strong>Urmatorul schimb de filtru:</strong> ${esc(next||"Nu este calculat")}</p>${days!==""?`<p><strong>Timp ramas:</strong> ${days>=0?days+" zile":"scadenta depasita cu "+Math.abs(days)+" zile"}</p><p><strong>Status:</strong> ${esc(status)}</p>`:""}</div><p class="small" style="text-align:center">Informatiile sunt actualizate din baza OFRESH Online.</p></div></div>`;
  return true;
}

function renderPublicMachineResponse(result){
  if(!result || result.success!==true || !result.machine) return false;
  const m=result.machine, filters=Array.isArray(result.filters)?result.filters:[];
  const f=filters.find(x=>String(x.Status||"Activ").toLowerCase()!=="inactiv")||filters[0]||{};
  const last=f["Data montare"]||f["Data schimbare"]||"";
  const next=f["Data urmatoarei schimbari"]||f["Data urmatoare schimbare"]||"";
  let days=""; if(next){const d=new Date(next);if(!isNaN(d))days=Math.ceil((d-new Date())/86400000);}
  const status=days===""?"":days<0?"DEPASIT":days<=15?"SCHIMBARE APROPIATA":"IN TERMEN";
  document.body.innerHTML=`<div class="techOverlay"><div class="techLogin" style="max-width:620px"><div class="techLogo">OFRESH</div><div class="eyebrow">INFORMATII FILTRU</div><h2>${esc(m.Client||"")}</h2><div class="panel" style="margin:15px 0;text-align:left"><p><strong>Aparat:</strong> ${esc(m["Tip aparat"]||"")}</p><p><strong>Serie:</strong> ${esc(m["Serie Aparat"]||"")}</p><p><strong>Zona:</strong> ${esc(m.Zona||"")}</p><p><strong>Tip filtru:</strong> ${esc(f["Tip filtru"]||"")}</p><p><strong>Ultimul schimb de filtru:</strong> ${esc(last||"Nu exista inregistrare")}</p><p><strong>Urmatorul schimb de filtru:</strong> ${esc(next||"Nu este calculat")}</p>${days!==""?`<p><strong>Timp ramas:</strong> ${days>=0?days+" zile":"scadenta depasita cu "+Math.abs(days)+" zile"}</p><p><strong>Status:</strong> ${esc(status)}</p>`:""}</div><p class="small" style="text-align:center">Informatiile sunt actualizate din baza OFRESH Online.</p></div></div>`;
  return true;
}
async function publicMachinePage(key,isQrToken=false){
  document.body.innerHTML='<div class="techOverlay"><div class="techLogin" style="max-width:620px"><div class="techLogo">OFRESH</div><div class="eyebrow">INFORMATII FILTRU</div><h2>Se incarca informatiile aparatului...</h2><p class="small">Se verifica datele aparatului.</p></div></div>';
  // Pentru QR folosim endpoint-ul public dedicat, care citeste doar Aparatul si Filtrele,
  // nu intreaga baza de date folosita de dashboard.
  if(isQrToken){
    try{
      const decoded=decodePublicQrToken(key)||String(key||"");
      const result=await api({action:"publicMachine",id:decoded});
      if(renderPublicMachineResponse(result)) return;
      document.body.innerHTML='<div class="techOverlay"><div class="techLogin"><div class="techLogo">OFRESH</div><h2>Aparatul nu a fost gasit</h2><p>Codul QR nu mai corespunde unui aparat din baza OFRESH.</p></div></div>';
    }catch(e){
      document.body.innerHTML='<div class="techOverlay"><div class="techLogin"><div class="techLogo">OFRESH</div><h2>Nu s-au putut incarca informatiile</h2><p>Verifica conexiunea la internet si incearca din nou.</p></div></div>';
    }
    return;
  }
  let rendered=false;
  try{ rendered=renderPublicMachineData(db,key,false); }catch(e){ rendered=false; }
  try{
    const data=await api({action:"read"});
    db={Locatii:[],Clienti:[],Aparate:[],Interventii:[],Filtre:[],Stoc:[],Tehnicieni:[],Utilizatori:[],...data};
    saveCachedData();
    if(!renderPublicMachineData(db,key,false) && !rendered){
      document.body.innerHTML='<div class="techOverlay"><div class="techLogin"><div class="techLogo">OFRESH</div><h2>Aparatul nu a fost gasit</h2><p>Codul QR nu mai corespunde unui aparat din baza OFRESH.</p></div></div>';
    }
  }catch(e){
    if(!rendered){ document.body.innerHTML='<div class="techOverlay"><div class="techLogin"><div class="techLogo">OFRESH</div><h2>Nu s-au putut incarca informatiile</h2><p>Verifica conexiunea la internet si incearca din nou.</p></div></div>'; }
  }
}

function openAdminLogin(){
  modal("Acces Administrator",`<div>
    ${inputField("User / Telefon","adminTelefon","","text")}
    ${inputField("PIN / Parola","adminPin","","password")}
  </div>`,`Intra in Administrator`,`loginAdministrator()`);
  setTimeout(()=>{
    const submit=ev=>{
      if(ev.key==="Enter"||ev.keyCode===13){
        ev.preventDefault();
        ev.stopImmediatePropagation();
        if(window.__ofreshAdminLoginBusy)return;
        window.__ofreshAdminLoginBusy=true;

  },50);
}
async function loginAdministrator(){
  const rawTelefon=String(document.getElementById("f_adminTelefon")?.value||"").trim();
  const pin=String(document.getElementById("f_adminPin")?.value||"").trim();
  const normalizePhone=x=>{let n=String(x??"").trim().replace(/\s+/g,"").replace(/-/g,"");if(/^0040/.test(n))n="0"+n.slice(4);else if(/^\+40/.test(n))n="0"+n.slice(3);return n;};
  const telefon=normalizePhone(rawTelefon);
  if(!rawTelefon||!pin)return msg("Completeaza userul/telefonul si PIN-ul.",false);
  const isActive=x=>{const st=String(x?.Status||x?.status||"Activ").trim().toLowerCase();return st!=="inactiv"&&st!=="inactive"};
  const matchesAdmin=x=>{
    if(!x||!isActive(x)||!userIsAdmin(x))return false;
    const storedPhone=normalizePhone(x.Telefon||x.telefon||"");
    const loginNames=[x.Username,x.username,x.User,x.user,x.Nume,x.nume,x["Nume utilizator"],x["ID Utilizator"]].map(z=>String(z??"").trim().toLowerCase()).filter(Boolean);
    const login=rawTelefon.toLowerCase();
    return ((storedPhone&&storedPhone===telefon)||loginNames.includes(login)||loginNames.includes(telefon.toLowerCase())) && userPin(x)===pin;
  };
  const openAdmin=(u)=>{adminSession=u;commercialSession=null;techSession=null;closeModal();enterAdminCleanMode();current="dashboard";render();load(true);};
  const localUser=(db.Utilizatori||[]).find(matchesAdmin);
  if(localUser){openAdmin(localUser);return;}
  if(rawTelefon.toLowerCase()==="admin" && pin==="1234"){openAdmin({"ID Utilizator":"ADMIN","Nume":"Administrator","Telefon":"admin","Rol":"administrator","Status":"Activ"});return;}
  try{
    const r=await api({action:"loginUser",telefon:telefon,user:rawTelefon,username:rawTelefon,pin:pin});
    if(r&&r.success&&r.user){if(!userIsAdmin(r.user))throw new Error("Contul nu are acces Administrator.");openAdmin(r.user);return;}
    if(r?.error)throw new Error(r.error);
  }catch(e){
    try{const data=await api({action:"read"});const users=Array.isArray(data?.Utilizatori)?data.Utilizatori:[];const found=users.find(matchesAdmin);if(found){openAdmin(found);return;}}catch(ignore){}
    msg(e.message||"User sau PIN incorect.",false);return;
  }
  msg("User sau PIN incorect.",false);
}
